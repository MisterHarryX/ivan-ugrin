<!doctype html>
<!-- Link preview card (1200×630). Render: msedge --headless --screenshot=og.png --window-size=1200,630 og-image.html, then save as JPEG under 300 KB to public/og-ivan.jpg. -->
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Cormorant; font-weight: 500; src: url(../../node_modules/@fontsource/cormorant-garamond/files/cormorant-garamond-cyrillic-500-normal.woff2) format('woff2'); }
  @font-face { font-family: Plex; font-weight: 400; src: url(../../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-cyrillic-400-normal.woff2) format('woff2'); }
  @font-face { font-family: Plex; font-weight: 500; src: url(../../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-cyrillic-500-normal.woff2) format('woff2'); }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background:
      radial-gradient(700px 520px at 78% 50%, rgba(63, 174, 140, .28), transparent 70%),
      radial-gradient(900px 600px at 10% 0%, #15392f, transparent 70%),
      #0b231f;
    color: #f6f0df; font-family: Plex, sans-serif;
    display: grid; grid-template-columns: 1fr 440px; align-items: center; gap: 40px; padding: 0 96px 0 96px;
  }
  .text { display: flex; flex-direction: column; gap: 28px; }
  .symbol { width: 76px; height: 76px; margin-left: -6px; }
  h1 { font-family: Cormorant, serif; font-weight: 500; font-size: 132px; line-height: .92; letter-spacing: -1px; }
  .rule { width: 72px; height: 2px; background: #eabf52; }
  .role { font-size: 34px; line-height: 1.3; color: #f6f0df; }
  .role span { color: #eabf52; }
  .photo { position: relative; width: 440px; height: 520px; }
  .photo::before { content: ''; position: absolute; inset: -14px; border: 2px solid rgba(234, 191, 82, .55); border-radius: 234px 234px 30px 30px; }
  .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; border-radius: 220px 220px 24px 24px; display: block; box-shadow: 0 30px 60px rgba(0, 0, 0, .4); }
</style>
</head>
<body>
  <div class="text">
    <img class="symbol" src="../../public/favicon.svg" alt="">
    <h1>Иван<br>Угрин</h1>
    <div class="rule"></div>
    <p class="role">Психолог<br><span>Москва и онлайн</span></p>
  </div>
  <div class="photo"><img src="../../public/photos/ivan-photo-960.jpg" alt=""></div>
</body>
</html>
